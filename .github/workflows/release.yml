name: Prepare draft release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build portable and corresponding-source archives
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Create preview draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create "v$version" @assets --draft --prerelease --target '${{ github.sha }}' --title "SwitchView $version (preview)" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed. Existing releases are never overwritten automatically.' }
